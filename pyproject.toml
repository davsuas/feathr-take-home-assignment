[project]
name = "eventplatform"
version = "1.0.0"
description = "Multi-tenant distributed event processing platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.13.0",
    "uvicorn[standard]==0.52.4",
    "pymongo==4.17.0",
    "elasticsearch==9.5.0",
    # Required by the async Elasticsearch client: without it AiohttpHttpNode raises
    # at construction, so every projection would fail at runtime.
    "aiohttp==3.14.3",
    "redis==8.1.0",
    "aio-pika==10.0.1",
    "structlog==26.1.0",
    "prometheus-client==0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "testcontainers[mongodb,elasticsearch,redis]==4.15.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "import-linter==2.5",
    "asgi-lifespan==2.1.0",
    "pyyaml==6.0.3",
]

[project.scripts]
eventplatform = "eventplatform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventplatform"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"tests/architecture/*" = ["S603"]  # runs the project's own pinned lint-imports binary

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["eventplatform"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "aio_pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "rabbitmq: requires a reachable RabbitMQ broker (skipped otherwise)",
    "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:eventplatform.*"]
